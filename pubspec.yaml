
name: nabzai
description: "NABZ AI medical appointment app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/nabz_logo.jpg

  fonts:
  - family: Vazirmatn
    fonts:
      - asset: assets/fonts/Vazirmatn-Regular.ttf
        weight: 400
      - asset: assets/fonts/Vazirmatn-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/Vazirmatn-Bold.ttf
        weight: 700
      - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
        weight: 800

  - family: Inter
    fonts:
      - asset: assets/fonts/Inter-SemiBold.ttf
        weight: 600